<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" role="img" aria-labelledby="title desc">
  <title id="title">エンジニア転職キャリア相談バナー</title>
  <desc id="desc">市場価値と職務経歴書を確認するためのPRバナー</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#eef3ff"/>
      <stop offset="1" stop-color="#eaffd8"/>
    </linearGradient>
  </defs>
  <rect width="300" height="250" rx="16" fill="url(#bg)"/>
  <rect x="10" y="10" width="280" height="230" rx="14" fill="none" stroke="#dce5f6"/>
  <rect x="22" y="22" width="38" height="22" rx="11" fill="#5b42d6"/>
  <text x="41" y="37" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">PR</text>
  <circle cx="232" cy="58" r="34" fill="#82df18" opacity=".9"/>
  <path d="M211 61l14 14 31-37" fill="none" stroke="#071632" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="78" fill="#071632" font-family="Arial, 'Hiragino Sans', sans-serif" font-size="20" font-weight="800">エンジニア転職</text>
  <text x="24" y="106" fill="#071632" font-family="Arial, 'Hiragino Sans', sans-serif" font-size="24" font-weight="900">市場価値を確認</text>
  <text x="24" y="136" fill="#63708b" font-family="Arial, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700">職務経歴書・面接・年収交渉の</text>
  <text x="24" y="157" fill="#63708b" font-family="Arial, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700">見せ方を整理したい方向け</text>
  <rect x="24" y="184" width="152" height="38" rx="19" fill="#5b42d6"/>
  <text x="100" y="208" text-anchor="middle" fill="#fff" font-family="Arial, 'Hiragino Sans', sans-serif" font-size="14" font-weight="800">無料で確認する</text>
  <path d="M210 186h42c12 0 22 10 22 22s-10 22-22 22h-42c-12 0-22-10-22-22s10-22 22-22z" fill="#fff" stroke="#dce5f6"/>
  <path d="M211 209h42M238 196l15 13-15 13" fill="none" stroke="#5b42d6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
